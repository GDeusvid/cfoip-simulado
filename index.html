<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulado CFO PCCE 2026 - Com Sistema de Save</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --correct: #10b981;
      --incorrect: #ef4444;
      --border: #cbd5e1;
      --topic-bg: #eff6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 800px;
      padding: 30px;
      position: relative;
    }

    /* BARRA DE SAVE / UPLOAD */
    .save-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 15px;
      margin-bottom: 20px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .save-toolbar-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .save-actions {
      display: flex;
      gap: 8px;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.82rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: #fff;
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-sm:hover {
      background-color: #e2e8f0;
    }

    .btn-save {
      background-color: #dbeafe;
      color: var(--primary);
      border-color: #bfdbfe;
    }

    .btn-save:hover {
      background-color: #bfdbfe;
    }

    .header {
      border-bottom: 2px solid var(--border);
      padding-bottom: 15px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .header h1 {
      font-size: 1.3rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge {
      background-color: var(--topic-bg);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-block;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 5px;
      gap: 10px;
    }

    .jump-select {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
      background: #fff;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 5px;
    }

    .progress-bar {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-title {
      font-size: 1.1rem;
      margin-bottom: 20px;
      line-height: 1.6;
      font-weight: 600;
      color: #1e293b;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
    }

    .option-btn {
      background-color: #fff;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      text-align: left;
      font-size: 0.98rem;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.4;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: #f8fafc;
    }

    .option-btn.correct {
      background-color: #d1fae5;
      border-color: var(--correct);
      color: #065f46;
      font-weight: 600;
    }

    .option-btn.incorrect {
      background-color: #fee2e2;
      border-color: var(--incorrect);
      color: #991b1b;
    }

    .option-btn:disabled {
      cursor: not-allowed;
    }

    .footer-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #64748b;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .btn:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }

    .hide {
      display: none !important;
    }

    .results {
      text-align: center;
      padding: 20px 0;
    }

    .results h2 {
      font-size: 1.8rem;
      margin-bottom: 15px;
      color: var(--primary);
    }

    .score-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: var(--topic-bg);
      border: 4px solid var(--primary);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 20px auto;
    }

    .score-num {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--primary);
    }

    .score-total {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .percentage {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }
      .header h1 {
        font-size: 1.1rem;
      }
      .save-toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .save-actions {
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- BARRA DE SAVE / LOAD DE ARQUIVO -->
    <div class="save-toolbar">
      <span class="save-toolbar-title">⚙️ Gerenciador de Progresso</span>
      <div class="save-actions">
        <button class="btn-sm btn-save" onclick="exportSave()" title="Baixar arquivo JSON com seu progresso">💾 Baixar Save</button>
        <button class="btn-sm" onclick="document.getElementById('file-input').click()" title="Carregar arquivo JSON baixado anteriormente">📂 Carregar Save</button>
        <button class="btn-sm" onclick="resetProgress()" title="Zerar todas as respostas">🗑️ Resetar</button>
        <!-- Input de arquivo invisível -->
        <input type="file" id="file-input" class="hide" accept=".json" onchange="importSave(event)">
      </div>
    </div>

    <!-- Tela do Quiz -->
    <div id="quiz-screen">
      <div class="header">
        <div class="header-top">
          <h1>Simulado CFO PCCE 2026</h1>
          <span class="badge" id="topic-badge">Tópico 1</span>
        </div>
        <div class="controls">
          <span id="progress-text" style="font-weight: 600; font-size: 0.9rem;">Questão 1 de 100</span>
          <div>
            <label for="jump-select" style="font-size: 0.85rem; color: var(--text-muted);">Ir para:</label>
            <select id="jump-select" class="jump-select" onchange="jumpToQuestion(this.value)">
              <!-- Opções geradas via JS -->
            </select>
          </div>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>

      <div class="question-title" id="question-text">
        <!-- Texto da pergunta -->
      </div>

      <div class="options" id="options-container">
        <!-- Botões de alternativa -->
      </div>

      <div class="footer-nav">
        <button class="btn btn-secondary" id="prev-btn" onclick="prevQuestion()" disabled>Anterior</button>
        <button class="btn" id="next-btn" onclick="nextQuestion()">Próxima</button>
      </div>
    </div>

    <!-- Tela de Resultados -->
    <div id="result-screen" class="results hide">
      <h2>Simulado Concluído!</h2>
      <p>Confira seu desempenho final no simulado de 100 questões:</p>
      
      <div class="score-circle">
        <div class="score-num" id="score-num">0</div>
        <div class="score-total">de 100 acertos</div>
      </div>

      <div class="percentage" id="percentage-text">0% de aproveitamento</div>

      <button class="btn" onclick="restartQuiz()">Refazer Simulado</button>
    </div>
  </div>

  <script>
    // BANCO DE DADOS COMPLETO - 100 QUESTÕES DO SIMULADO CFO PCCE 2026
    const questions = [

    // ESTADO DA APLICAÇÃO
    let currentQuestionIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);

    // ELEMENTOS DO DOM
    const topicBadgeEl = document.getElementById("topic-badge");
    const progressTextEl = document.getElementById("progress-text");
    const progressBarEl = document.getElementById("progress-bar");
    const jumpSelectEl = document.getElementById("jump-select");
    const questionTextEl = document.getElementById("question-text");
    const optionsContainerEl = document.getElementById("options-container");
    const prevBtnEl = document.getElementById("prev-btn");
    const nextBtnEl = document.getElementById("next-btn");
    const quizScreenEl = document.getElementById("quiz-screen");
    const resultScreenEl = document.getElementById("result-screen");
    const scoreNumEl = document.getElementById("score-num");
    const percentageTextEl = document.getElementById("percentage-text");

    // Inicialização do Select de salto de questões
    function initJumpSelect() {
      jumpSelectEl.innerHTML = "";
      questions.forEach((_, i) => {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `Q. ${i + 1}`;
        jumpSelectEl.appendChild(opt);
      });
    }

    // Carregar Questão Atual
    function loadQuestion() {
      const q = questions[currentQuestionIndex];

      topicBadgeEl.textContent = q.topic;
      progressTextEl.textContent = `Questão ${currentQuestionIndex + 1} de ${questions.length}`;
      progressBarEl.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
      jumpSelectEl.value = currentQuestionIndex;

      questionTextEl.textContent = q.question;
      optionsContainerEl.innerHTML = "";
      const answered = userAnswers[currentQuestionIndex] !== null;

      q.options.forEach((optText, index) => {
        const button = document.createElement("button");
        button.classList.add("option-btn");
        button.textContent = optText;

        if (answered) {
          button.disabled = true;
          const selected = userAnswers[currentQuestionIndex];
          if (index === q.answer) {
            button.classList.add("correct");
          }
          if (index === selected && selected !== q.answer) {
            button.classList.add("incorrect");
          }
        } else {
          button.addEventListener("click", () => selectOption(index));
        }

        optionsContainerEl.appendChild(button);
      });

      prevBtnEl.disabled = currentQuestionIndex === 0;
      if (currentQuestionIndex === questions.length - 1) {
        nextBtnEl.textContent = "Finalizar Prova";
      } else {
        nextBtnEl.textContent = "Próxima";
      }

      // Salva progresso no navegador automaticamente
      autoSaveToLocalStorage();
    }

    // Seleção de alternativa
    function selectOption(index) {
      userAnswers[currentQuestionIndex] = index;
      loadQuestion();
    }

    // Navegação
    function nextQuestion() {
      if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex++;
        loadQuestion();
      } else {
        showResults();
      }
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        loadQuestion();
      }
    }

    function jumpToQuestion(index) {
      currentQuestionIndex = parseInt(index, 10);
      loadQuestion();
    }

    // --- FUNÇÕES DO GERENCIADOR DE SAVE (EXPORTAR / IMPORTAR) ---

    // 1. Exportar progresso para um arquivo .json
    function exportSave() {
      const saveData = {
        title: "Simulado CFO PCCE 2026",
        savedAt: new Date().toLocaleString("pt-BR"),
        currentQuestionIndex: currentQuestionIndex,
        userAnswers: userAnswers
      };

      const jsonStr = JSON.stringify(saveData, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement("a");
      a.href = url;
      a.download = `simulado_pcce_save_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // 2. Importar progresso de um arquivo .json
    function importSave(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (data && Array.isArray(data.userAnswers) && data.userAnswers.length === questions.length) {
            userAnswers = data.userAnswers;
            currentQuestionIndex = typeof data.currentQuestionIndex === 'number' ? data.currentQuestionIndex : 0;
            
            // Garantir visualização no Quiz
            resultScreenEl.classList.add("hide");
            quizScreenEl.classList.remove("hide");
            
            loadQuestion();
            alert("✅ Save carregado com sucesso! Suas respostas anteriores foram restauradas.");
          } else {
            alert("❌ O arquivo selecionado não é compatível com este simulado.");
          }
        } catch (err) {
          alert("❌ Erro ao ler o arquivo de save.");
        }
      };
      reader.readAsText(file);
      event.target.value = ""; // Limpa a seleção do arquivo
    }

    // 3. Auto-save via localStorage
    function autoSaveToLocalStorage() {
      const state = {
        currentQuestionIndex: currentQuestionIndex,
        userAnswers: userAnswers
      };
      localStorage.setItem("pcce_quiz_autosave", JSON.stringify(state));
    }

    function autoLoadFromLocalStorage() {
      const saved = localStorage.getItem("pcce_quiz_autosave");
      if (saved) {
        try {
          const data = JSON.parse(saved);
          if (Array.isArray(data.userAnswers) && data.userAnswers.length === questions.length) {
            userAnswers = data.userAnswers;
            currentQuestionIndex = data.currentQuestionIndex || 0;
          }
        } catch (e) {
          console.error("Erro no auto-load", e);
        }
      }
    }

    // 4. Resetar todo o progresso
    function resetProgress() {
      if (confirm("Tem certeza que deseja zerar todas as suas respostas do simulado?")) {
        userAnswers.fill(null);
        currentQuestionIndex = 0;
        localStorage.removeItem("pcce_quiz_autosave");
        resultScreenEl.classList.add("hide");
        quizScreenEl.classList.remove("hide");
        loadQuestion();
      }
    }

    // Exibir Resultado Final
    function showResults() {
      let score = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans === questions[idx].answer) {
          score++;
        }
      });

      quizScreenEl.classList.add("hide");
      resultScreenEl.classList.remove("hide");

      scoreNumEl.textContent = score;
      const pct = Math.round((score / questions.length) * 100);
      percentageTextEl.textContent = `${pct}% de aproveitamento`;
    }

    // Reiniciar Quiz
    function restartQuiz() {
      resetProgress();
    }

    // Iniciar Sistema
    initJumpSelect();
    autoLoadFromLocalStorage();
    loadQuestion();
  </script>
